name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          DATE=$(date +%Y.%m.%d)
          # Count existing tags for today
          COUNT=$(git tag -l "v${DATE}.*" | wc -l)
          INCREMENT=$((COUNT + 1))
          VERSION="v${DATE}.${INCREMENT}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Release created on ${{ github.event.head_commit.timestamp }}

            Commit: ${{ github.event.head_commit.url }}
          draft: false
          prerelease: false
